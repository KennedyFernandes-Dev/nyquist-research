name: Qualidade e reprodutibilidade

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.1"
      - run: uv sync --locked --all-extras --group security
      - run: uv run --locked ruff check src tests validation experiments application firmware
      - run: uv run --locked mypy
      - run: uv run --locked pytest --cov=nyquist_research --cov-report=term-missing
      - run: uv run --locked --group security bandit -q -r src application firmware
