[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[project]
name = "nyquist-research"
version = "0.1.0"
description = "Análise reproduzível de estabilidade de sistemas LIT contínuos."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["numpy>=2.2,<3"]

[project.optional-dependencies]
app = ["streamlit>=1.50,<2", "plotly>=6,<7"]
analysis = ["matplotlib>=3.10,<4", "scipy>=1.15,<2", "control>=0.10.2,<0.11", "sympy>=1.13,<2", "mpmath>=1.3,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "pytest-benchmark>=5,<6", "hypothesis>=6,<7", "ruff>=0.11,<1", "mypy>=1.16,<3", "pre-commit>=4,<5"]
security = ["bandit>=1.8,<2", "pip-audit>=2.9,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
files = ["src/nyquist_research"]
check_untyped_defs = true
warn_unused_ignores = true
